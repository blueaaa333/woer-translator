name: Release asset staging probe
on:
  push:
    branches: [codex/voice-bundle-runtime-probe]
    paths:
      - .github/workflows/release-assets-stage-probe.yml
      - scripts/release_assets_stage_probe.py
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  stage-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download source and reports from the completed Windows probe
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-voice-installer-probe-43156159232
          repository: blueaaa333/woer-translator
          run-id: 43156159232
          github-token: ${{ github.token }}
          path: build/previous-windows-probe
      - name: Exercise source-linked four-payload release staging
        run: >-
          python scripts/release_assets_stage_probe.py
          --artifact-root build/previous-windows-probe
          --output-root build/release-assets-stage-probe
          --version 0.3.23 --run-id 43156159232
      - name: Upload the small staging report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets-stage-probe-${{ github.run_id }}
          path: build/release-assets-stage-probe/report.json
          if-no-files-found: warn
          retention-days: 14
