name: Desktop interface checks
on:
  push:
    branches: [main]
    paths: ['scripts/check_gui.py', '.github/workflows/gui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/prepare_data.py
      - run: python scripts/check_gui.py
