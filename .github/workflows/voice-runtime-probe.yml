name: Temporary Piper runtime validation
on:
  push:
    branches: [codex/voice-bundle-runtime-probe]
    paths:
      - .github/workflows/voice-runtime-probe.yml
      - scripts/voice_runtime_lock.json
      - scripts/build_piper_runtime.ps1
      - scripts/archive_piper_sources.ps1
      - scripts/fetch_pinned_voices.py
      - scripts/voice_runtime_smoke.py
      - pronunciation.py
      - voice_profile.py
      - lexicon.py
      - recorded_audio.py
      - chinese_text.py
      - requirements.txt
      - scripts/voice_bundle.py
      - tests/test_voice_bundle.py
      - tests/test_speech_latency.py
      - scripts/verify_piper_source_archive.py
      - scripts/preflight_voice_licenses.py
      - tests/test_source_archive.py
  workflow_dispatch:
    inputs:
      mode:
        description: Discover ORT digest, build the runtime, or run voice smoke
        required: true
        type: choice
        options: [DiscoverOrt, SourceArchive, BuildRuntime, VoiceSmoke, TestPeDependencyRecords, TestMsvcRedistDiscovery]
        default: DiscoverOrt
permissions:
  contents: read
concurrency:
  group: temporary-piper-runtime-probe
  cancel-in-progress: false
jobs:
  windows-runtime:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - name: Check runner tools
        shell: pwsh
        run: |
          git --version
          cmake --version
          python --version
      - name: Verify PE dependency record handling
        if: github.event_name == 'push' || github.event.inputs.mode == 'TestPeDependencyRecords'
        shell: pwsh
        run: ./scripts/build_piper_runtime.ps1 -Mode TestPeDependencyRecords
      - name: Install declared app import dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check opencc-python-reimplemented==0.1.7
      - name: Run path and packaging fixtures
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_voice_bundle.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_source_archive.py -v
      - name: Discover or build
        shell: pwsh
        env:
          MODE: ${{ github.event_name == 'push' && 'TestMsvcRedistDiscovery' || github.event.inputs.mode || 'DiscoverOrt' }}
        run: ./scripts/build_piper_runtime.ps1 -Mode $env:MODE
      - name: Upload short-lived validation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: piper-runtime-probe-${{ github.run_id }}
          path: |
            build/voice-runtime/ort-hash-evidence.json
            build/voice-runtime/speech/runtime/piper/**
            build/voice-runtime/licenses/**
            build/voice-runtime/runtime-manifest.json
            build/voice-runtime/runtime-dependency-report.json
            build/voice-runtime/piper-runtime-source.zip
            build/voice-runtime/source-manifest.json
            build/voice-runtime/voice-smoke.json
          if-no-files-found: warn
          retention-days: 14
  voice-license-metadata:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - name: Read fixed-revision metadata and model cards only
        shell: pwsh
        run: python scripts/preflight_voice_licenses.py --lock scripts/voice_runtime_lock.json --report build/voice-licensing/voice-license-preflight.json
      - name: Upload text-only license evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voice-license-preflight-${{ github.run_id }}
          path: build/voice-licensing/voice-license-preflight.json
          if-no-files-found: warn
          retention-days: 14

