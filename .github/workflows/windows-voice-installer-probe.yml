name: Windows bundled voice installer probe
on:
  push:
    branches: [codex/voice-bundle-runtime-probe]
    paths:
      - .github/workflows/windows-voice-installer-probe.yml
      - app.py
      - scripts/build_release.py
      - scripts/distribution_audit.py
      - scripts/prepare_voice_bundle.py
      - scripts/build_windows_voice_bundle_probe.ps1
      - scripts/voice_runtime_lock.json
      - scripts/build_piper_runtime.ps1
      - scripts/archive_piper_sources.ps1
      - scripts/fetch_pinned_voices.py
      - scripts/preflight_voice_licenses.py
      - scripts/verify_piper_source_archive.py
      - tests/run_windows_voice_installer_probe.ps1
      - tests/test_prepare_voice_bundle.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-bundled-voice-installer-probe
  cancel-in-progress: false
jobs:
  windows-package-install:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build pinned public dictionary inputs
        shell: pwsh
        run: |
          python scripts/build_ecdict.py --output build/ecdict/words.db
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/prepare_data.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run repository unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Read locked model license evidence
        shell: pwsh
        run: python scripts/preflight_voice_licenses.py --lock scripts/voice_runtime_lock.json --report build/voice-licensing/voice-license-preflight.json
      - name: Build and smoke pinned Piper runtime
        shell: pwsh
        run: ./scripts/build_piper_runtime.ps1 -Mode VoiceSmoke
      - name: Stage bundle and test the real Inno installer
        shell: pwsh
        run: ./scripts/build_windows_voice_bundle_probe.ps1
      - name: Upload only reports and corresponding source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-voice-installer-probe-${{ github.run_id }}
          path: |
            build/voice-package-review/*.json
            build/voice-runtime/piper-runtime-source.zip
            build/voice-runtime/source-manifest.json
          if-no-files-found: warn
          retention-days: 14

